<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E3B22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Nome que aparece embaixo do ícone no iPhone -->
  <meta name="apple-mobile-web-app-title" content="AvocadoCheck">
  <meta name="application-name" content="AvocadoCheck">
  <title>AvocadoCheck</title>
  <!-- Ícone da aba do navegador -->
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <!-- Ícone da tela inicial: iPhone usa o apple-touch-icon, Android usa o manifest -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <main id="app" aria-live="polite"></main>
    <div id="sheet-root"></div>
    <div id="toast" role="status"></div>
  </div>
  <input type="file" id="pick-gallery" accept="image/*" hidden>
  <input type="file" id="pick-camera" accept="image/*" capture="environment" hidden>
  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
